<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="latheBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="blueSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#latheBg)"/>
  
  <!-- Precision Heavy Lathe & Workshop Machine -->
  <g transform="translate(60, 60)">
    <!-- Lathe Bed & Guide Rails -->
    <rect x="20" y="190" width="440" height="40" rx="4" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <rect x="40" y="230" width="60" height="50" fill="#1E293B"/>
    <rect x="380" y="230" width="60" height="50" fill="#1E293B"/>

    <!-- Headstock & Chuck -->
    <rect x="20" y="70" width="120" height="130" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="140" cy="130" r="45" fill="#475569" stroke="#94A3B8" stroke-width="4"/>
    <rect x="130" y="110" width="40" height="40" fill="#CBD5E1"/>

    <!-- Machined Precision Shaft -->
    <rect x="170" y="122" width="200" height="16" fill="url(#blueSteel)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Tailstock -->
    <polygon points="370,100 430,100 440,200 360,200" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <circle cx="370" cy="130" r="12" fill="#F59E0B"/>

    <!-- Tool Post / Carriage & Spark Flashes -->
    <rect x="250" y="138" width="40" height="60" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <polygon points="260,118 275,118 270,138 265,138" fill="#E2E8F0"/>
    
    <!-- Golden Machining Sparks -->
    <circle cx="265" cy="120" r="3" fill="#FCD34D"/>
    <circle cx="255" cy="112" r="2" fill="#FCD34D"/>
    <circle cx="275" cy="110" r="2" fill="#FCD34D"/>
  </g>

  <!-- Feature Badge -->
  <rect x="30" y="320" width="540" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="352" font-family="sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">MACHINE WORKSHOP &amp; PRECISION LATHE SERVICES</text>
  <text x="550" y="352" font-family="sans-serif" font-size="13" fill="#38BDF8" font-weight="bold" text-anchor="end">SHAFT TURNING • PRESS FITTING • BALANCING</text>
</svg>
