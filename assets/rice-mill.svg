<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="millBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="greenMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#millBg)"/>
  
  <!-- Rice Mill & Flour Mill Machine Rig -->
  <g transform="translate(80, 50)">
    <!-- Grain Elevator Tower -->
    <rect x="40" y="30" width="50" height="230" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <line x1="65" y1="40" x2="65" y2="250" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8,6"/>
    <!-- Elevator Buckets -->
    <rect x="55" y="60" width="20" height="12" rx="2" fill="#F59E0B"/>
    <rect x="55" y="110" width="20" height="12" rx="2" fill="#F59E0B"/>
    <rect x="55" y="160" width="20" height="12" rx="2" fill="#F59E0B"/>
    <rect x="55" y="210" width="20" height="12" rx="2" fill="#F59E0B"/>

    <!-- Modern Huller / Polisher Body -->
    <rect x="130" y="90" width="180" height="150" rx="8" fill="url(#greenMetal)" stroke="#064E3B" stroke-width="3"/>
    <!-- Rubber Rollers Section -->
    <circle cx="180" cy="150" r="35" fill="#334155" stroke="#CBD5E1" stroke-width="6"/>
    <circle cx="255" cy="150" r="35" fill="#334155" stroke="#CBD5E1" stroke-width="6"/>
    
    <!-- Shaft & Cast Pulley Network -->
    <circle cx="370" cy="180" r="50" fill="none" stroke="#F59E0B" stroke-width="12"/>
    <circle cx="370" cy="180" r="16" fill="#1E293B"/>
    <path d="M180,150 L370,180" stroke="#94A3B8" stroke-width="6" stroke-dasharray="6,4"/>

    <!-- Pillow Block Bearings (UCP 208) -->
    <rect x="160" y="195" width="40" height="20" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="235" y="195" width="40" height="20" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Feature Badge -->
  <rect x="30" y="320" width="540" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="352" font-family="sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">COMPLETE RICE, FLOUR &amp; OIL MILL SETUPS</text>
  <text x="550" y="352" font-family="sans-serif" font-size="13" fill="#34D399" font-weight="bold" text-anchor="end">RUBBER ROLLS • ELEVATOR BELTS • UCP</text>
</svg>
