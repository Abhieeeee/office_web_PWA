<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Technical Grid Background -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
  </g>

  <!-- Deep Groove Ball Bearing Illustration -->
  <g transform="translate(180, 200)">
    <!-- Outer Ring -->
    <circle r="120" fill="none" stroke="url(#steelGrad)" stroke-width="24"/>
    <!-- Inner Track -->
    <circle r="96" fill="none" stroke="#334155" stroke-width="4"/>
    <!-- Balls -->
    <circle cx="0" cy="-80" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="56" cy="-56" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="80" cy="0" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="56" cy="56" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="0" cy="80" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="-56" cy="56" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="-80" cy="0" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <circle cx="-56" cy="-56" r="16" fill="url(#steelGrad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Inner Ring -->
    <circle r="60" fill="none" stroke="url(#steelGrad)" stroke-width="20"/>
    <!-- Center Bore -->
    <circle r="40" fill="#0B1120"/>
    <text x="0" y="5" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle" font-weight="bold">SKF / NBC</text>
  </g>

  <!-- Industrial V-Belt Graphic -->
  <g transform="translate(420, 200)">
    <!-- Pulley 1 -->
    <circle cx="-30" cy="-40" r="45" fill="none" stroke="url(#steelGrad)" stroke-width="14"/>
    <circle cx="-30" cy="-40" r="18" fill="#1E293B"/>
    <!-- Pulley 2 -->
    <circle cx="60" cy="50" r="65" fill="none" stroke="url(#steelGrad)" stroke-width="16"/>
    <circle cx="60" cy="50" r="24" fill="#1E293B"/>
    <!-- Tension Belt -->
    <path d="M-30,-85 L60,-15 A65,65 0 0,1 60,115 L-30,5 A45,45 0 0,1 -30,-85" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-30,-85 L60,-15 A65,65 0 0,1 60,115 L-30,5 A45,45 0 0,1 -30,-85" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="8,4"/>
  </g>

  <!-- Badge Label -->
  <rect x="30" y="320" width="540" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="352" font-family="sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">PRECISION BEARINGS, V-BELTS &amp; CAST PULLEYS</text>
  <text x="550" y="352" font-family="sans-serif" font-size="13" fill="#10B981" font-weight="bold" text-anchor="end">SKF • NBC • URB • NTN • FENNER</text>
</svg>
